server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024
spring:
  flyway:
    # Supabase may create helper functions in public before the first app migration.
    # Baseline at 0 so V1 still creates the Playbit schema and seed migrations run.
    baseline-on-migrate: true
    baseline-version: 0
  datasource:
    url: "${DATABASE_JDBC_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/playbit}}"
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Leave room for overlapping deployments within the Supabase session pool limit.
      maximum-pool-size: ${DATABASE_POOL_SIZE:4}
      minimum-idle: 1
      idle-timeout: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    serialization:
      write-dates-as-timestamps: false
playbit:
  supabase-url: ${SUPABASE_URL:https://wwekwmfjckgghbewptly.supabase.co}
  jwt-secret: ${SUPABASE_JWT_SECRET:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  xp:
    completion: 30
    correct: 10
    win: 50
    recovery: 20
    bot-daily-limit: 10
  ai:
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-3.5-flash-lite}
    admin-ids: ${AI_ADMIN_IDS:}
  search:
    tavily-key: ${TAVILY_API_KEY:}
